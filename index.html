{n:NEWN,lv:"A1",d:"Ikki zamonni solishtirish",subj:1,

{n:"Future Simple Tense",lv:"A1",d:"Kelasi oddiy zamon: ishlatilish holatlari va bog’lovchilar",
 f:["(+) darak|S + will/shall + V1|I’ll do smth tomorrow.","Bog’lovchi + Present, Future|If/once/after/before/as soon as/until + S + Present Simple, S + will/shall + V1|If you come us today, we will go fishing together.","(+) you + shall|You + shall + V1 (do’q-po’pisa)|If you overuse your phone you shall be blind."],

 r:["If/once dan oldin will/shall/would ishlatilmaydi","to be sure — ishonch hosil qilmoq. to be = I am, he/she/it is, we/you/they are + sure","Bog’lovchilar: if — agar · once · after · before · as soon as — bilanoq · so long as — gacha · in case — mabodo · in case of — tufayli · until/till"],
 s:"ertaga=tomorrow;keyingi (vaqt)=next;keyinroq=later;ishonmoq=believe=+;o’ylamoq=think=+;umid qilmoq=hope/expect=+;ishonch hosil qilmoq=be sure/am sure/is sure/are sure/to be sure=+;balki, ehtimol=probably/perhaps/maybe=+;agar=if=B;bir marta (… bo’lsa)=once=B;… dan keyin=after=B;… dan oldin=before=B;… bilanoq=as soon as=B;… gacha (shart bilan)=so long as=B;mabodo=in case=B;… tufayli=in case of=B;… gacha (muddat tugaguncha)=until/till=B"},

{n:"Past Continuous",lv:"A2",d:"O’tgan davomli zamon (was — birlik, were — ko’plik)",subj:1,

 u:["Hozirgi zamonda oldindan rejalashtirilgan ishlar|Tomorrow at 9 a.m. we’re going to have a lesson.","Natijasi 2- yoki 3-shaxsga yaqqol ko’rinib turgan ishlar|The car is coming too fast. It’s going to have an accident."]},
{n:"Present Perfect Simple",lv:"A2",d:"Hozirgi tugallangan oddiy zamon",subj:1,

{n:"Can / Could / Be able to",lv:"A2",d:"Qobiliyat, imkoniyat, ruxsat",

{n:"Must",lv:"A2",d:"Majburiyat, taqiq, kuchli taxmin",

{n:"Should / Had better / Ought to",lv:"A2",d:"Maslahat (should — 30%)",
 f:["(+) should|S + should + V1|You should start your own business.","(−) shouldn’t|S + should not + V1|You shouldn’t go there.","(+) had better|S + had better + V1|You had better go.","(−) had better not|S + had better not + V1|You had better not go there.","(+) ought to|S + ought to + V1|Residents ought to pass their taxes.","(+) be supposed to|S + am/is/are/was/were supposed to + V1|You are supposed to win the competition."],

{n:"May / Might",lv:"B1",d:"Ehtimol va ruxsat",

async function hashPw(pw,salt){try{const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(salt),iterations:60000},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;const t=salt+pw;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return"w"+(h>>>0).toString(16)}}
